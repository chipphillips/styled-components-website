name: ci
on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          cache: yarn
          node-version-file: ".nvmrc"

      - name: Install
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Type Check
        run: yarn type-check

      - name: Jest
        run: yarn test

      - name: Build
        run: yarn build

  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          cache: yarn
          node-version-file: ".nvmrc"
      - name: Install
        run: yarn install --immutable
      - name: Build
        run: yarn build
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun
